    <path d="M92 198 320 301 320 524 92 417Z" fill="url(#flecks)" stroke="none"/>
    <path d="M320 301 548 198 548 417 320 524Z" fill="url(#flecks)" stroke="none"/>
    <path d="m276 115 91 41-92 43-90-41z" fill="#ead6ae" stroke="#a27a4c" stroke-width="3"/>
    <path d="m275 199 0 111 45 21 0-111z" fill="#ead6ae" stroke="#a27a4c" stroke-width="3"/>
