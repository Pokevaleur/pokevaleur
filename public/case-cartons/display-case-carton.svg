<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Carton scellé pour displays Pokémon</title>
  <desc id="desc">Petit carton d'expédition en kraft, fermé avec du ruban et une étiquette display.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4c796"/><stop offset="1" stop-color="#c99b60"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd8951"/><stop offset="1" stop-color="#98623a"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a87343"/><stop offset="1" stop-color="#80512f"/></linearGradient>
    <pattern id="flecks" width="18" height="18" patternUnits="userSpaceOnUse">
