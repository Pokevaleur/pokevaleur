    <text x="71.5" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#30271f">CARTON SCELLÉ</text>
    <text x="71.5" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#68472d">DISPLAY 36 BOOSTERS</text>
    <path d="M19 78h105" stroke="#b9a181" stroke-width="2"/>
