<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Différence entre une carte classique et une carte reverse</title>
  <desc id="desc">Deux cartes exemples côte à côte. La carte reverse a un fond brillant irisé autour de l’illustration, qui reste mate.</desc>
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72d7ee"/>
      <stop offset=".22" stop-color="#b8a6f5"/>
      <stop offset=".42" stop-color="#f5a8c8"/>
      <stop offset=".62" stop-color="#ffe17d"/>
      <stop offset=".82" stop-color="#92dfbd"/>
      <stop offset="1" stop-color="#79c7f1"/>
    </linearGradient>
    <linearGradient id="foilShine" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".68"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="foilLines" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="18" height="18" fill="url(#foil)"/>
      <path d="M0 0V18" stroke="#fff" stroke-opacity=".42" stroke-width="4"/>
      <circle cx="9" cy="9" r="2" fill="#fff" fill-opacity=".65"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17314c" flood-opacity=".14"/>
    </filter>
    <clipPath id="cardClip"><rect x="558" y="144" width="236" height="316" rx="19"/></clipPath>
  </defs>
  <rect width="960" height="560" rx="28" fill="#f4f7fb"/>
  <text x="48" y="62" fill="#927016" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.5">RECONNAÎTRE UNE VARIANTE</text>
  <text x="48" y="105" fill="#102b49" font-family="Arial, sans-serif" font-size="34" font-weight="800">Classique ou Reverse ?</text>

  <g filter="url(#shadow)">
    <rect x="164" y="144" width="236" height="316" rx="19" fill="#fff" stroke="#d9e1e9" stroke-width="3"/>
    <rect x="182" y="162" width="200" height="31" rx="8" fill="#f1f4f7"/>
    <text x="194" y="183" fill="#31465d" font-family="Arial, sans-serif" font-size="13" font-weight="700">CARTE EXEMPLE</text>
    <rect x="182" y="204" width="200" height="127" rx="11" fill="#edf2f6"/>
    <circle cx="282" cy="267" r="43" fill="#d5e4ee"/>
    <path d="M253 277c6-28 19-42 30-42s24 14 30 42c-10-6-19-8-30-8s-20 2-30 8Z" fill="#8aabc1"/>
    <circle cx="268" cy="270" r="4" fill="#102b49"/><circle cx="296" cy="270" r="4" fill="#102b49"/>
    <path d="M274 287q8 7 16 0" fill="none" stroke="#102b49" stroke-width="3" stroke-linecap="round"/>
    <text x="182" y="357" fill="#31465d" font-family="Arial, sans-serif" font-size="13" font-weight="700">Illustration</text>
    <rect x="182" y="371" width="154" height="8" rx="4" fill="#e7ebf0"/>
    <rect x="182" y="389" width="183" height="8" rx="4" fill="#e7ebf0"/>
    <rect x="182" y="413" width="200" height="29" rx="8" fill="#f1f4f7"/>
    <text x="194" y="433" fill="#6b7a8b" font-family="Arial, sans-serif" font-size="12">Fond mat</text>
  </g>
  <rect x="203" y="475" width="158" height="38" rx="19" fill="#e7edf3"/>
  <text x="282" y="500" text-anchor="middle" fill="#31465d" font-family="Arial, sans-serif" font-size="16" font-weight="700">CLASSIQUE</text>

  <g filter="url(#shadow)">
    <g clip-path="url(#cardClip)">
      <rect x="558" y="144" width="236" height="316" rx="19" fill="url(#foilLines)"/>
      <rect x="558" y="144" width="236" height="316" fill="url(#foilShine)" opacity=".55"/>
      <rect x="576" y="162" width="200" height="31" rx="8" fill="#ffffff" fill-opacity=".9"/>
      <text x="588" y="183" fill="#31465d" font-family="Arial, sans-serif" font-size="13" font-weight="700">CARTE EXEMPLE</text>
      <rect x="576" y="204" width="200" height="127" rx="11" fill="#edf2f6"/>
      <circle cx="676" cy="267" r="43" fill="#d5e4ee"/>
      <path d="M647 277c6-28 19-42 30-42s24 14 30 42c-10-6-19-8-30-8s-20 2-30 8Z" fill="#8aabc1"/>
      <circle cx="662" cy="270" r="4" fill="#102b49"/><circle cx="690" cy="270" r="4" fill="#102b49"/>
      <path d="M668 287q8 7 16 0" fill="none" stroke="#102b49" stroke-width="3" stroke-linecap="round"/>
      <rect x="576" y="340" width="200" height="96" rx="10" fill="#ffffff" fill-opacity=".9"/>
      <text x="590" y="366" fill="#31465d" font-family="Arial, sans-serif" font-size="13" font-weight="700">Illustration mate</text>
      <rect x="590" y="380" width="154" height="7" rx="3.5" fill="#dfe5eb"/>
      <rect x="590" y="396" width="170" height="7" rx="3.5" fill="#dfe5eb"/>
      <rect x="590" y="414" width="79" height="8" rx="4" fill="url(#foilLines)"/>
    </g>
    <rect x="558" y="144" width="236" height="316" rx="19" fill="none" stroke="#d9e1e9" stroke-width="3"/>
  </g>
  <rect x="597" y="475" width="158" height="38" rx="19" fill="#fff0b6"/>
  <text x="676" y="500" text-anchor="middle" fill="#765900" font-family="Arial, sans-serif" font-size="16" font-weight="800">REVERSE ✦</text>

  <path d="M800 218h70" stroke="#53718c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="800" cy="218" r="5" fill="#53718c"/>
  <rect x="825" y="190" width="111" height="56" rx="12" fill="#fff"/>
  <text x="880" y="213" text-anchor="middle" fill="#31465d" font-family="Arial, sans-serif" font-size="12" font-weight="700">Fond brillant</text>
  <text x="880" y="231" text-anchor="middle" fill="#6b7a8b" font-family="Arial, sans-serif" font-size="11">effet irisé</text>

  <text x="48" y="539" fill="#65758a" font-family="Arial, sans-serif" font-size="15">Sur une Reverse, l’effet brillant se trouve généralement autour de l’illustration.</text>
</svg>