<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Carte standard et carte jumbo</title><desc id="d">Deux silhouettes de carte montrent les différences de format.</desc><rect width="960" height="600" rx="32" fill="#f4f7fb"/><text x="48" y="66" fill="#17324d" font-family="Arial,sans-serif" font-size="31" font-weight="700">Une même idée, deux formats</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(177 112)"><rect width="230" height="330" rx="20" fill="#fff" stroke="#c7d8e8" stroke-width="4"/><rect x="20" y="20" width="190" height="142" rx="12" fill="#d9ecf5"/><circle cx="115" cy="85" r="35" fill="#f4d56f"/><path d="M84 133l31-54 31 54z" fill="#ed8969"/><rect x="20" y="180" width="190" height="18" rx="9" fill="#244c78"/><rect x="20" y="211" width="142" height="12" rx="6" fill="#d6e1ec"/><rect x="20" y="234" width="170" height="12" rx="6" fill="#d6e1ec"/><rect x="20" y="270" width="190" height="36" rx="12" fill="#fff1d7"/><text x="115" y="365" fill="#17324d" font-size="21" font-weight="700">Format standard</text></g><g transform="translate(530 96)"><rect width="270" height="386" rx="24" fill="#fff" stroke="#e4a94d" stroke-width="5"/><rect x="22" y="22" width="226" height="170" rx="14" fill="#d9ecf5"/><circle cx="135" cy="104" r="43" fill="#f4d56f"/><path d="M97 164l38-68 38 68z" fill="#ed8969"/><rect x="22" y="213" width="226" height="20" rx="10" fill="#244c78"/><rect x="22" y="248" width="168" height="14" rx="7" fill="#d6e1ec"/><rect x="22" y="273" width="205" height="14" rx="7" fill="#d6e1ec"/><rect x="22" y="314" width="226" height="42" rx="14" fill="#fff1d7"/><text x="135" y="421" fill="#17324d" font-size="22" font-weight="700">Format jumbo</text></g></g><text x="480" y="565" fill="#526579" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Schéma explicatif — une carte jumbo demande une protection grand format.</text></svg>