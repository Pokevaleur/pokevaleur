<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1010" role="img" aria-labelledby="title desc">
<title id="title">Types et symboles du JCC Pokémon</title>
<desc id="desc">Légende illustrée des onze symboles de type utilisés sur les cartes Pokémon et dans les coûts d'attaque.</desc>
<rect width="1080" height="1010" rx="34" fill="#f3f7fb"/>
<text x="540" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17324d">Les symboles d’Énergie</text>
<text x="540" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5c6e80">Ils indiquent le type d’un Pokémon ou le coût d’une attaque</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g transform="translate(55 150)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#4caf50"/><path d="M94 88 Q80 50 126 42 Q133 77 94 88 M96 83L122 50" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Plante</text><text x="110" y="176" font-size="14" fill="#617487">feuille</text></g>
 <g transform="translate(300 150)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#e94b38"/><path d="M109 39 C118 58 139 69 128 90 C119 108 84 101 83 82 C82 69 95 58 109 39Z" fill="#fff"/><path d="M108 69 C116 78 113 88 103 92 C98 85 102 77 108 69Z" fill="#e94b38"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Feu</text><text x="110" y="176" font-size="14" fill="#617487">flamme</text></g>
 <g transform="translate(545 150)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#3195d0"/><path d="M110 39 C99 57 82 73 89 89 C97 109 124 109 132 89 C139 73 121 55 110 39Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Eau</text><text x="110" y="176" font-size="14" fill="#617487">goutte</text></g>
 <g transform="translate(790 150)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#f2c329"/><path d="M119 37 L91 77 H107 L99 108 L132 64 H114Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Électrique</text><text x="110" y="176" font-size="14" fill="#617487">éclair</text></g>
 <g transform="translate(55 365)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#8c62b5"/><path d="M72 75 Q110 37 148 75 Q110 113 72 75Z" fill="none" stroke="#fff" stroke-width="6"/><circle cx="110" cy="75" r="12" fill="#fff"/><circle cx="110" cy="75" r="5" fill="#8c62b5"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Psy</text><text x="110" y="176" font-size="14" fill="#617487">œil</text></g>
 <g transform="translate(300 365)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#bb6b32"/><path d="M83 82 L86 58 Q88 51 94 55 L96 71 L100 48 Q102 41 108 47 L108 70 L113 46 Q116 40 121 46 L120 72 L127 54 Q133 49 136 57 L132 84 Q128 101 111 103 L98 101Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Combat</text><text x="110" y="176" font-size="14" fill="#617487">poing</text></g>
 <g transform="translate(545 365)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#263849"/><path d="M123 44 A34 34 0 1 0 138 92 A28 28 0 0 1 123 44Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Obscurité</text><text x="110" y="176" font-size="14" fill="#617487">croissant sombre</text></g>
 <g transform="translate(790 365)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#667986"/><circle cx="110" cy="74" r="24" fill="none" stroke="#fff" stroke-width="7"/><path d="M96 74 L110 56 L124 74 L110 92Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Métal</text><text x="110" y="176" font-size="14" fill="#617487">emblème métallique</text></g>
 <g transform="translate(177 580)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#df82b9"/><path d="M110 39 L119 64 L145 54 L128 75 L145 94 L119 84 L110 109 L101 84 L75 94 L92 75 L75 54 L101 64Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Fée</text><text x="110" y="176" font-size="14" fill="#617487">type des anciennes séries</text></g>
 <g transform="translate(422 580)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#c39b38"/><path d="M82 91 L91 63 L107 49 L133 51 L143 66 L131 72 L127 90 L110 99 L96 91Z" fill="#fff"/><circle cx="127" cy="62" r="3" fill="#c39b38"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Dragon</text><text x="110" y="176" font-size="14" fill="#617487">type de Pokémon</text></g>
 <g transform="translate(667 580)"><rect width="220" height="190" rx="22" fill="#fff" stroke="#d7e1e9" stroke-width="3"/><circle cx="110" cy="74" r="43" fill="#87929a"/><path d="M110 43 L118 63 L140 54 L131 75 L145 91 L121 89 L110 108 L99 89 L75 91 L89 75 L80 54 L102 63Z" fill="#fff"/><text x="110" y="151" font-size="22" font-weight="700" fill="#17324d">Incolore</text><text x="110" y="176" font-size="14" fill="#617487">étoile : toute Énergie</text></g>
</g>
<rect x="60" y="820" width="960" height="130" rx="22" fill="#fff5dc" stroke="#efdfa9" stroke-width="2"/>
<text x="90" y="860" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#6d5514">À retenir</text>
<text x="90" y="894" font-family="Arial,sans-serif" font-size="17" fill="#4e5965">Le symbole incolore dans un coût d’attaque se paie avec n’importe quel type d’Énergie.</text>
<text x="90" y="923" font-family="Arial,sans-serif" font-size="17" fill="#4e5965">Dragon et Incolore ne sont pas des cartes Énergie de base. Fée est un type historique.</text>
<text x="540" y="985" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#687b8c">Schéma pédagogique : pictogrammes simplifiés, à comparer au symbole imprimé sur chaque carte.</text>
</svg>