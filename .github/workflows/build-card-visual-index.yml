name: Generate card visual index

on:
  push:
    branches:
      - feat/scanner-catalogue-cartes
    paths:
      - scripts/build-card-visual-index.py
      - .github/workflows/build-card-visual-index.yml

permissions:
  contents: write

concurrency:
  group: card-visual-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out scanner branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate visual fingerprints
        env:
          SUPABASE_URL: https://ehdnpntvbfnnzljbxneb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_qLsPOwf1OGj0ze4G2LYMAA_1qY83EcD
        run: python scripts/build-card-visual-index.py

      - name: Commit generated catalogue index
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STASHED_CHANGES=false
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked -m "generated card visual index"
            STASHED_CHANGES=true
          fi
          git fetch origin "$BRANCH_NAME"
          git rebase "origin/$BRANCH_NAME"
          if [ "$STASHED_CHANGES" = true ]; then
            git stash pop
          fi
          git add public/card-visual-index.json
          if git diff --cached --quiet; then
            echo "Visual index is already up to date."
            exit 0
          fi
          git commit -m "Generate public card visual index"
          git push origin HEAD:"$BRANCH_NAME"
